services:

  inventario:
    build: ./inventario
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q0-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  pedidos:
    build: ./pedidos
    ports:
      - "3000:3000"
    environment:
      INVENTARIO_URL: http://inventario:3001
    healthcheck:
      test: ["CMD", "wget", "-q0-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5